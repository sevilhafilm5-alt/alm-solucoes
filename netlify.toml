# ── Força HTTPS e canonical sem-www ──────────────────────────────────────────
[[redirects]]
  from = "http://almusinagem.com.br/*"
  to = "https://almusinagem.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.almusinagem.com.br/*"
  to = "https://almusinagem.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.almusinagem.com.br/*"
  to = "https://almusinagem.com.br/:splat"
  status = 301
  force = true

# Netlify preview / alm-solucoes.netlify.app → domínio canônico
[[redirects]]
  from = "https://alm-solucoes.netlify.app/*"
  to = "https://almusinagem.com.br/:splat"
  status = 301
  force = true

# ── SPA fallback (deve ser o último redirect) ─────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/servicos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "text/html; charset=utf-8"
